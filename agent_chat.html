<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assistant IA — Mondher Formation</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060a0f;
    --surface: #0c1219;
    --border: #1a2535;
    --accent: #00c8ff;
    --accent2: #0055ff;
    --green: #00ffaa;
    --text: #e8f4ff;
    --muted: #4a6a88;
    --user-bg: linear-gradient(135deg, #0044cc, #0088ff);
    --bot-bg: #0d1822;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    font-family: 'Syne', sans-serif;
    color: var(--text);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* animated bg */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 600px 400px at 80% 20%, rgba(0,80,255,0.07), transparent),
      radial-gradient(ellipse 400px 300px at 10% 80%, rgba(0,200,255,0.05), transparent),
      repeating-linear-gradient(rgba(0,150,255,0.025) 0, rgba(0,150,255,0.025) 1px, transparent 1px, transparent 40px),
      repeating-linear-gradient(90deg, rgba(0,150,255,0.025) 0, rgba(0,150,255,0.025) 1px, transparent 1px, transparent 40px);
    pointer-events: none;
    z-index: 0;
  }

  .chat-container {
    position: relative;
    z-index: 1;
    width: 480px;
    height: 680px;
    background: var(--surface);
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 0 60px rgba(0,150,255,0.08), 0 40px 80px rgba(0,0,0,0.5);
  }

  /* header */
  .header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
    background: linear-gradient(90deg, rgba(0,50,150,0.15), transparent);
    flex-shrink: 0;
  }

  .avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
    position: relative;
  }
  .avatar::after {
    content: '';
    position: absolute;
    bottom: 1px; right: 1px;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--green);
    border: 2px solid var(--surface);
    animation: pulse-dot 2s ease-in-out infinite;
  }
  @keyframes pulse-dot {
    0%,100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(0.85); }
  }

  .header-info {}
  .header-name {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #fff;
  }
  .header-status {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--green);
    letter-spacing: 2px;
    margin-top: 2px;
  }

  .header-badge {
    margin-left: auto;
    background: rgba(0,200,255,0.1);
    border: 1px solid rgba(0,200,255,0.25);
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    padding: 4px 10px;
  }

  /* messages */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }
  .messages::-webkit-scrollbar { width: 3px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* message bubbles */
  .msg {
    display: flex;
    gap: 10px;
    animation: fadeUp 0.3s ease;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg.user { flex-direction: row-reverse; }

  .msg-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
    align-self: flex-end;
  }
  .msg.bot .msg-avatar { background: linear-gradient(135deg, #001a40, #003380); border: 1px solid rgba(0,150,255,0.3); }
  .msg.user .msg-avatar { background: linear-gradient(135deg, var(--accent2), var(--accent)); }

  .msg-content { max-width: 75%; }

  .msg-bubble {
    padding: 12px 16px;
    font-size: 14px;
    line-height: 1.6;
    font-weight: 400;
  }
  .msg.bot .msg-bubble {
    background: var(--bot-bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 2px 16px 16px 16px;
  }
  .msg.user .msg-bubble {
    background: var(--user-bg);
    color: #fff;
    border-radius: 16px 2px 16px 16px;
    text-align: right;
  }

  .msg-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 1px;
    margin-top: 5px;
    padding: 0 4px;
  }
  .msg.user .msg-time { text-align: right; }

  /* typing indicator */
  .typing-bubble {
    display: none;
    background: var(--bot-bg);
    border: 1px solid var(--border);
    padding: 14px 18px;
    border-radius: 2px 16px 16px 16px;
    width: fit-content;
  }
  .typing-bubble.show { display: flex; gap: 5px; align-items: center; }
  .typing-bubble span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: bounce 1.2s ease-in-out infinite;
  }
  .typing-bubble span:nth-child(2) { animation-delay: 0.2s; }
  .typing-bubble span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%,60%,100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  /* welcome message */
  .welcome {
    text-align: center;
    padding: 20px 16px;
    animation: fadeUp 0.5s ease;
  }
  .welcome-icon { font-size: 36px; margin-bottom: 10px; }
  .welcome-title {
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 6px;
  }
  .welcome-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
    line-height: 1.8;
  }

  /* divider */
  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border), transparent);
    margin: 4px 0;
    flex-shrink: 0;
  }

  /* input area */
  .input-area {
    padding: 16px 20px 20px;
    flex-shrink: 0;
  }

  .input-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    background: #080e16;
    border: 1px solid var(--border);
    padding: 10px 14px;
    transition: border-color 0.2s;
  }
  .input-row:focus-within {
    border-color: rgba(0,150,255,0.4);
    box-shadow: 0 0 0 3px rgba(0,100,255,0.06);
  }

  textarea {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    resize: none;
    max-height: 100px;
    line-height: 1.5;
    padding: 2px 0;
  }
  textarea::placeholder { color: var(--muted); font-size: 13px; }

  .send-btn {
    width: 36px;
    height: 36px;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
    clip-path: polygon(0 0, 100% 0, 100% 80%, 80% 100%, 0 100%);
  }
  .send-btn:hover { transform: scale(1.05); box-shadow: 0 4px 16px rgba(0,150,255,0.3); }
  .send-btn:active { transform: scale(0.95); }
  .send-btn svg { width: 16px; height: 16px; fill: white; }

  .input-hint {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 1px;
    margin-top: 8px;
    text-align: center;
  }

  /* suggestions */
  .suggestions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .suggestion {
    background: rgba(0,100,200,0.1);
    border: 1px solid rgba(0,150,255,0.2);
    color: #88aacc;
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.5px;
    padding: 6px 12px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .suggestion:hover {
    background: rgba(0,150,255,0.15);
    border-color: rgba(0,200,255,0.4);
    color: var(--accent);
  }
</style>
</head>
<body>

<div class="chat-container">

  <!-- Header -->
  <div class="header">
    <div class="avatar">🤖</div>
    <div class="header-info">
      <div class="header-name">Assistant IA</div>
      <div class="header-status">● EN LIGNE</div>
    </div>
    <div class="header-badge">MONDHER FORMATION</div>
  </div>

  <!-- Messages -->
  <div class="messages" id="messages">
    <div class="welcome">
      <div class="welcome-icon">✨</div>
      <div class="welcome-title">Bonjour ! Je suis votre assistant IA</div>
      <div class="welcome-sub">
        Posez-moi n'importe quelle question<br>
        Je suis disponible 24h/24 · 7j/7
      </div>
    </div>

    <!-- typing indicator -->
    <div class="msg bot" id="typing-msg" style="display:none">
      <div class="msg-avatar">🤖</div>
      <div class="typing-bubble show">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <div class="divider"></div>

  <!-- Input -->
  <div class="input-area">
    <div class="suggestions" id="suggestions">
      <div class="suggestion" onclick="sendSuggestion(this)">C'est quoi DevOps ?</div>
      <div class="suggestion" onclick="sendSuggestion(this)">Explique l'IA</div>
      <div class="suggestion" onclick="sendSuggestion(this)">Aide-moi</div>
    </div>

    <div class="input-row">
      <textarea
        id="userInput"
        placeholder="Écrivez votre message..."
        rows="1"
        onkeydown="handleKey(event)"
        oninput="autoResize(this)"
      ></textarea>
      <button class="send-btn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
      </button>
    </div>
    <div class="input-hint">ENTRÉE pour envoyer · SHIFT+ENTRÉE pour nouvelle ligne</div>
  </div>

</div>

<script>
const WEBHOOK_URL = "https://mondhermaaoui.app.n8n.cloud/webhook/b4906f07-9663-4fe2-a44e-5f5bc6d3de3d";

function getTime() {
  return new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}

function addMessage(text, isUser) {
  const messages = document.getElementById('messages');
  const typingMsg = document.getElementById('typing-msg');

  const msg = document.createElement('div');
  msg.className = `msg ${isUser ? 'user' : 'bot'}`;

  msg.innerHTML = `
    <div class="msg-avatar">${isUser ? '👤' : '🤖'}</div>
    <div class="msg-content">
      <div class="msg-bubble">${text}</div>
      <div class="msg-time">${getTime()}</div>
    </div>
  `;

  messages.insertBefore(msg, typingMsg);
  messages.scrollTop = messages.scrollHeight;
}

function showTyping(show) {
  const typingMsg = document.getElementById('typing-msg');
  const messages = document.getElementById('messages');
  typingMsg.style.display = show ? 'flex' : 'none';
  if (show) messages.scrollTop = messages.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;

  // Hide suggestions
  document.getElementById('suggestions').style.display = 'none';

  // Add user message
  addMessage(text, true);
  input.value = '';
  input.style.height = 'auto';

  // Show typing
  showTyping(true);

  try {
    const response = await fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });

    const data = await response.json();
    showTyping(false);
    addMessage(data.output || "Je n'ai pas pu traiter votre demande.", false);
  } catch (error) {
    showTyping(false);
    addMessage("❌ Erreur de connexion. Veuillez réessayer.", false);
  }
}

function sendSuggestion(el) {
  document.getElementById('userInput').value = el.textContent;
  sendMessage();
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}
</script>
</body>
</html>
